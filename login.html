<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KAU Lost and Found Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <img src="images/logo.png" alt="KAU Lost and Found logo" width="50" height="50" usemap="#logomap">
    <map name="logomap">
      <area shape="rect" coords="0,0,50,50" href="about.html" alt="About Us">
    </map>
    <b>KAU Lost and Found</b>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="signup.html">Sign Up</a></li>
      <li><a href="about.html">About Us</a></li>
    </ul>
  </nav>

  <main>
    <h1>Log in</h1>
    <p>Log in to report a lost or found item.</p>
    <section class="box">
      <form onsubmit="return checkLogin()" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@gmail.com" oninput="checkEmail()" required>
        <span id="emailMsg" style="display: block;"></span>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <span id="passwordMsg" style="display: block;"></span>

        <p id="message" style="color: red;"></p>
        <button type="submit" class="btn">Login</button>
      </form>
      <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
    </section>
  </main>

  <footer>
    <p>KAU Lost and Found</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
